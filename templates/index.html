<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>📝 Smart To-Do</h1>
                <button id="theme-toggle" class="icon-btn">🌙</button>
            </div>
            <div id="clock" class="clock">Loading time...</div>
        </header>

        <!-- Task Addition Form -->
        <form id="addForm" class="add-form">
            <input type="text" name="name" placeholder="What needs to be done?" required autocomplete="off">
            
            <div class="form-row">
                <input type="date" name="due_date" title="Due Date">
                <input type="time" name="due_time" title="Due Time">
                <select name="priority">
                    <option value="Low">Low Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>
                <button type="submit">Add Task</button>
            </div>
        </form>

        <!-- Task List Container -->
        <div class="task-list">
            {% for task in tasks %}
            <div class="task-card {% if task.done %}done{% endif %}" data-id="{{ task.id }}" {% if task.due_date %}data-due="{{ task.due_date }} {{ task.due_time or '' }}"{% endif %}>
                <div class="task-info">
                    <span class="title">{{ task.name }}</span>
                    <div class="meta">
                        <span class="priority priority-{{ task.priority|lower }}">{{ task.priority }}</span> 
                        {% if task.due_date %}| Due: {{ task.due_date }} {{ task.due_time or '' }}{% endif %}
                        {% if task.overdue %}<span class="overdue-badge">⚠️ Overdue</span>{% endif %}
                    </div>
                </div>
                <div class="task-actions">
                    <button class="done-btn" data-id="{{ task.id }}">✔</button>
                    <button class="del-btn" data-id="{{ task.id }}">🗑</button>
                </div>
            </div>
            {% else %}
            <p class="empty-state">No tasks yet. Add one above!</p>
            {% endfor %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
